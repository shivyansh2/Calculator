<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <main>
        <div class="container">
            <h1><i>Calculator</i></h1>
            <div class="input-field">
                <input type="text" id="digits" placeholder="Enter digits">
            </div>
            <div class="box-outer">
                <button class="clear-input">C</button>
                <button class="divide-input">/</button>
                <button class="multiply-input">*</button>
                <button class="subtract-input">-</button>
                <button class="add-input">+</button>
                <button class="result">=</button>
                <button class="box0">0</button>
                <button class="box1">1</button>
                <button class="box2">2</button>
                <button class="box3">3</button>
                <button class="box4">4</button>
                <button class="box5">5</button>
                <button class="box6">6</button>
                <button class="box7">7</button>
                <button class="box8">8</button>
                <button class="box9">9</button>
            </div>
        </div>
    </main>
    <script src="script.js"></script>
</body>
<footer>
    <i>---Shivyansh Thakur</i>
</footer>
</html>
